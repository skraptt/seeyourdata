<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeeYourData</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <img class="mark" src="../icons/icon-32.png" alt="" width="20" height="20">

  <script type="module" src="popup.js"></script>
